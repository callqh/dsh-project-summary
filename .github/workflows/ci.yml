name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Check committed build artifacts
        run: git diff --exit-code -- lib client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload component previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-verification
          path: verification/
          if-no-files-found: ignore
